name: Deploy Server to Deno Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/deployctl@v1
        with:
          project: koreshki-fight-club
          entrypoint: server/main.ts
          include: |
            server
            src/shared
            public/data
