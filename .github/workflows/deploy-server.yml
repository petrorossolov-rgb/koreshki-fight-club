name: Deploy Server to Deno Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: deno install --global -Arf jsr:@deno/deployctl

      - run: deployctl deploy --project=koreshki-fight-club --entrypoint=server/main.ts --include=server,src/shared,public/data
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
